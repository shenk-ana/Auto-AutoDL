<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Auto-AutoDL</title>
  <desc id="d">Let AI agents rent AutoDL GPUs and shut them down when done</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131a35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="250" cy="180" r="220" fill="url(#glow)"/>

  <!-- chip mark -->
  <g transform="translate(160 90)" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" fill="none">
    <g stroke-opacity="0.9">
      <path d="M45 0v22M90 0v22M135 0v22"/>
      <path d="M45 158v22M90 158v22M135 158v22"/>
      <path d="M0 45h22M0 90h22M0 135h22"/>
      <path d="M158 45h22M158 90h22M158 135h22"/>
    </g>
    <rect x="22" y="22" width="136" height="136" rx="22" fill="#0f172a"/>
    <!-- power symbol: machines switch themselves off -->
    <path d="M66 70a36 36 0 1 0 48 0" stroke-width="9"/>
    <path d="M90 52v40" stroke="#7dd3fc" stroke-width="9"/>
  </g>

  <!-- wordmark -->
  <text x="410" y="170" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="#f8fafc">Auto-<tspan fill="url(#accent)">AutoDL</tspan></text>
  <text x="414" y="228" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="500" fill="#cbd5e1">Let AI agents rent GPUs — and switch them off when done.</text>

  <!-- pills -->
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" fill="#e2e8f0">
    <g transform="translate(414 262)">
      <rect width="120" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#5eead4" stroke-opacity="0.5"/>
      <text x="60" y="24" text-anchor="middle">acquire</text>
    </g>
    <text x="548" y="286" font-size="20" fill="#64748b">→</text>
    <g transform="translate(576 262)">
      <rect width="90" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#7dd3fc" stroke-opacity="0.5"/>
      <text x="45" y="24" text-anchor="middle">exec</text>
    </g>
    <text x="680" y="286" font-size="20" fill="#64748b">→</text>
    <g transform="translate(708 262)">
      <rect width="120" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="60" y="24" text-anchor="middle">release</text>
    </g>
    <g transform="translate(860 262)">
      <rect width="220" height="36" rx="18" fill="#5eead4" fill-opacity="0.12"/>
      <circle cx="22" cy="18" r="5" fill="#5eead4"/>
      <text x="118" y="24" text-anchor="middle" fill="#99f6e4">auto power-off</text>
    </g>
  </g>
</svg>
